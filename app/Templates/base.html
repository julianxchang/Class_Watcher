<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}UCI Class Watcher{% endblock %}</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='styles/style.css') }}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header>
      <nav class="top-nav">
        <a href="{{ url_for('index') }}" class="home-link">UCI Class Watcher</a>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-menu" id="navMenu">
          <a class="home-button" href="{{ url_for('index') }}">Home</a>
          <a class="contact-button nav-style" href="{{ url_for('contact') }}">Contact</a>
        </div>
      </nav>
    </header>
    <main>{% block content %} {% endblock %}</main>
    <footer>
      <a href="{{ url_for('changelog') }}" class="changelog-link">
        <h1>Changlog</h1>
      </a>
    </footer>
    <script>
      const hamburger = document.getElementById('hamburger');
      const navMenu = document.getElementById('navMenu');
      hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navMenu.classList.toggle('active');
      });
      // Close menu when clicking on a link
      document.querySelectorAll('.nav-menu a').forEach(link => {
        link.addEventListener('click', () => {
          hamburger.classList.remove('active');
          navMenu.classList.remove('active');
        });
      });
    </script>
  </body>
</html>
