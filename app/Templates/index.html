{% extends "base.html" %} {% block title %}Welcome{% endblock %} {% block
content %}
<form method="post" action="/run">
  <div class="form">
    <div class="title">Welcome</div>
    <div class="subtitle">
      Enter information below to start watching a class
    </div>
    <div class="subtitle">
      A list of supported departments can be found
      <a class="here-link" href="{{ url_for('support') }}">here</a>
    </div>
    <div class="input-container ic1">
      <input
        id="email"
        class="input"
        type="email"
        placeholder=" "
        name="email"
        required
      />
      <div class="cut cut-short"></div>
      <label for="email" class="placeholder">Email</label>
    </div>
    <div class="input-container ic2">
      <select
        id="department"
        class="input"
        name="department"
        required
        onchange="this.setAttribute('data-selected', this.value !== '')"
      >
        <option value="" disabled selected hidden></option>
        <option value="I&C SCI">
          I&C SCI (Information & Computer Science)
        </option>
        <option value="COMPSCI">COMPSCI (Computer Science)</option>
        <option value="IN4MATX">IN4MATX (Informatics)</option>
        <option value="CHEM">CHEM (Chemistry)</option>
        <option value="MATH">MATH (Mathematics)</option>
        <option value="PHYSICS">PHYSICS (Physics)</option>
        <option value="BIO SCI">BIO SCI (Biological Sciences)</option>
        <option value="ECON">ECON (Economics)</option>
        <option value="HISTORY">HISTORY (History)</option>
      </select>
      <div class="cut cut-medium"></div>
      <label for="department" class="placeholder">Department</label>
    </div>
    <div class="input-container ic3">
      <input
        id="course_number"
        class="input"
        type="text"
        placeholder=" "
        name="course_number"
        required
      />
      <div class="cut cut-long"></div>
      <label for="course_number" class="placeholder"
        >Course Number (e.g., 33 for ICS 33)</label
      >
    </div>
    <button class="submit" type="submit" value="Start Watching" name="action">
      Start Watching
    </button>
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
  </div>
</form>
{% endblock %}
