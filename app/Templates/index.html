{% extends "base.html" %} {% block title %}Welcome - UCI Class Watcher{%
endblock %} {% block content %}
<form method="post" action="/run">
  <div class="form">
    <div class="title">Welcome</div>
    <div class="subtitle">
      Enter information below to start watching a class
    </div>
    <div class="input-container ic1">
      <input
        id="email"
        class="input"
        type="email"
        placeholder=" "
        name="email"
        required
      />
      <div class="cut cut-short"></div>
      <label for="email" class="placeholder">Email</label>
    </div>
    <div class="input-container ic2" style="position: relative">
      <input
        id="department"
        class="input"
        type="text"
        placeholder=" "
        name="department"
        required
        autocomplete="off"
      />
      <div id="department-suggestions" class="autocomplete-dropdown"></div>
      <div class="cut cut-medium"></div>
      <label for="department" class="placeholder">Department</label>
    </div>
    <div class="subtitle-small">
      Don't see your department? Request it
      <a class="here-link" href="{{ url_for('contact') }}">here</a>
    </div>
    <div class="input-container ic3">
      <input
        id="course_number"
        class="input"
        type="text"
        placeholder=" "
        name="course_number"
        required
      />
      <div class="cut cut-long"></div>
      <label for="course_number" class="placeholder"
        >Course Number (e.g., 33 for ICS 33)</label
      >
    </div>
    <button class="submit" type="submit" value="Start Watching" name="action">
      Start Watching
    </button>
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
  </div>
</form>

  const input = document.getElementById("department");
  const dropdown = document.getElementById("department-suggestions");
  let selectedIndex = -1;

  input.addEventListener("input", function () {
    const value = this.value.toUpperCase();
    dropdown.innerHTML = "";
    selectedIndex = -1;

    if (value.length === 0) {
      dropdown.style.display = "none";
      return;
    }

    const matches = departments.filter(
      (dept) =>
        dept.value.includes(value) || dept.label.toUpperCase().includes(value)
    );

    if (matches.length > 0) {
      matches.slice(0, 8).forEach((dept, index) => {
        const div = document.createElement("div");
        div.className = "autocomplete-item";
        div.textContent = dept.label;
        div.addEventListener("click", function () {
          input.value = dept.value;
          dropdown.style.display = "none";
        });
        dropdown.appendChild(div);
      });
      dropdown.style.display = "block";
    } else {
      dropdown.style.display = "none";
    }
  });

  input.addEventListener("focus", function () {
    if (this.value.length > 0) {
      const event = new Event("input");
      this.dispatchEvent(event);
    }
  });

  input.addEventListener("keydown", function (e) {
    const items = dropdown.querySelectorAll(".autocomplete-item");

    if (e.key === "ArrowDown") {
      e.preventDefault();
      selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
      updateSelection(items);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      selectedIndex = Math.max(selectedIndex - 1, -1);
      updateSelection(items);
    } else if (e.key === "Enter" && selectedIndex >= 0) {
      e.preventDefault();
      items[selectedIndex].click();
    } else if (e.key === "Escape") {
      dropdown.style.display = "none";
    }
  });

  function updateSelection(items) {
    items.forEach((item, index) => {
      if (index === selectedIndex) {
        item.classList.add("selected");
        item.scrollIntoView({ block: "nearest" });
      } else {
        item.classList.remove("selected");
      }
    });
  }

  document.addEventListener("click", function (e) {
    if (e.target !== input && e.target !== dropdown) {
      dropdown.style.display = "none";
    }
  });
