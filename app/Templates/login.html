{% extends "base.html" %} {% block title %}Log in - UCI Class Watcher{% endblock
%} {% block content %}
<form method="post" action="/login">
  <div class="form">
    <div class="title">Log in</div>
    <div class="input-container ic1">
      <input
        id="email"
        class="input"
        type="email"
        placeholder=" "
        name="email"
        required
      />
      <div class="cut email-cut"></div>
      <label for="email" class="placeholder">Email</label>
    </div>
    <div class="input-container ic2">
      <input
        id="password"
        class="input"
        type="password"
        placeholder=" "
        name="password"
        required
      />
      <div class="cut password-cut"></div>
      <label for="password" class="placeholder">Password</label>
    </div>
    <button class="submit" type="submit" value="Log In" name="action">
      Log In
    </button>
    <div class="subtitle-small">
      Don't have an account? Sign up
      <a class="here-link" href="{{ url_for('signup') }}">here</a>
    </div>
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="success-message">{{ success }}</div>
    {% endif %}
  </div>
</form>
{% endblock %}
